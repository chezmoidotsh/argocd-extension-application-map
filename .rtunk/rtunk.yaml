# Configuration of rtunk for this repository: the linters, runtimes and plugin sources that
# `rtunk check` uses here (trunk.yaml format). Run it with `mise run lint`.
version: 0.1
cli:
  version: 1.24.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - eslint # disable because all formatters has been removed from ESLint >= 9.x
  enabled:
    - renovate@41.46.3
    - svgo@4.0.0
    - actionlint@1.7.7
    - osv-scanner@2.0.3
    - oxipng@9.1.5
    - yamllint@1.37.1
    - checkov@3.2.457
    - git-diff-check
    - markdownlint@0.45.0
    - prettier@3.6.2
    - taplo@0.9.3
    - trufflehog@3.90.2
  ignore:
    - linters: [ALL]
      paths:
        - examples/**/*.yaml
    - linters: [markdownlint]
      paths:
        - src/**/*.mdx
    # Dependency vulnerabilities are reported by the OSV-Scanner workflow (code scanning) and
    # `security:audit`; the only finding left is `braces`, a dev dependency of Storybook.
    - linters: [osv-scanner]
      paths:
        - pnpm-lock.yaml
