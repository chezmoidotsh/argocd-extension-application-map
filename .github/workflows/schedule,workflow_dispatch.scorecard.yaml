# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# =============================================================================
# OpenSSF Scorecard — Supply-chain security score
# =============================================================================
# Runs the OpenSSF Scorecard checks weekly and on demand, and publishes the results
# to the Security tab and the public Scorecard API.
#
# Jobs:
#   scorecard — OpenSSF Scorecard checks, from oss.scorecard
#
# MANAGED BY TERRAFORM (axnic/.github, terraform/modules/workflows) — do not edit by hand.
# Reusable workflow: https://github.com/axnic/.github/blob/main/.github/workflows/oss.scorecard.yaml
# =============================================================================

name: OpenSSF Scorecard

on:
  schedule:
    - cron: 0 5 * * 1
  workflow_dispatch: {}

# Minimal top-level permissions — each job declares what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # scorecard — OpenSSF Scorecard checks, from oss.scorecard
  # ---------------------------------------------------------------------------
  scorecard:
    name: 🛡️ OpenSSF Scorecard
    # Pinned to the axnic/.github commit that last changed this workflow; Terraform keeps it up to date.
    uses: axnic/.github/.github/workflows/oss.scorecard.yaml@b774f843ae4860bbbfa4603da7d6dbc50f1a5d99 # main
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
