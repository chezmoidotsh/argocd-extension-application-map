# -- Configure MISE requirements
[tools]
# Kubernetes tools
argocd = "latest"
helm = "3.22.0"
kind = "0.33.0"
kubectl = "1.37.1"

# Development tools
node = "lts"
pnpm = "latest"
tilt = "latest"

# Lint and convention tools
"github:axnic/rtunk" = "latest" # Lint stack driven by .rtunk/rtunk.yaml (`lint`)
"npm:@commitlint/cli" = "21.2.3" # Commit convention check, drives .commitlintrc.js (`ci:commitlint`)

# -- Configure MISE environment
[env]
HELM_CACHE_HOME = "{{ config_root }}/.misenv/helm/cache"
HELM_CONFIG_HOME = "{{ config_root }}/.misenv/helm/config"
HELM_DATA_HOME = "{{ config_root }}/.misenv/helm/data"
KUBECONFIG = "{{ config_root }}/.misenv/kubeconfig"

# -- Configure MISE tasks
[tasks.setup]
description = "Create a local Kubernetes cluster"
run = "kind get clusters | grep -q 'argocd-dev' || kind create cluster --name argocd-dev --image kindest/node:v1.32.3"

[tasks.teardown]
description = "Delete the local Kubernetes cluster"
run = "kind delete cluster --name argocd-dev"

[tasks.dev]
description = "Start the development environment"
depends = ["setup"]
run = "tilt up"

# -- CI tasks: the central workflows of axnic/.github and the local ones only run `mise run <task>`
[tasks.lint]
description = "Lint the whole repository with rtunk"
run = "rtunk check ."

[tasks."lint:fix"]
description = "Lint the whole repository with rtunk and apply the fixes"
run = "rtunk check --fix ."

[tasks."ci:commitlint"]
description = "Validate commit messages in a range (usage: mise run ci:commitlint -- --from <sha> --to <sha> | --last)"
usage = 'arg "[args]..." var=#true'
run = '''
# commitlint reads stdin when given no range, which would hang: require one.
case " $usage_args " in
  *" --from "*|*" --to "*|*" --last "*|*" -f "*|*" -t "*|*" -l "*) ;;
  *) echo "usage: mise run ci:commitlint -- --from <sha> --to <sha> | --last" >&2; exit 2 ;;
esac
eval "set -- $usage_args"
commitlint --verbose "$@"
'''

[tasks."ci:install"]
description = "Install the Node.js dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."ci:build"]
description = "Build the extension bundle (dist/extension-application-map.tar)"
depends = ["ci:install"]
run = "pnpm build"

[tasks."ci:test"]
description = "Run the Jest tests (writes junit.xml and coverage/)"
depends = ["ci:install"]
run = "pnpm test:ci"

[tasks.ci]
description = "Local CI quality gate: lint, build, tests (commit messages and security:audit excluded)"
depends = ["lint", "ci:build", "ci:test"]

[tasks."security:audit"]
description = "Audit the production dependencies for known vulnerabilities"
run = "pnpm audit --prod"
